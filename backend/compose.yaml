services:
  postgres:
    image: postgres:16-alpine
    container_name: eduos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduos
      POSTGRES_USER: eduos
      POSTGRES_PASSWORD: eduos_dev_password
    ports:
      - "5432:5432"
    volumes:
      - eduos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduos -d eduos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eduos_postgres_data:
